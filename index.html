<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Llink | FLOW LAB</title>
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="20" r="18" fill="none" stroke="%23FF5733" stroke-width="3"/><circle cx="76" cy="35" r="18" fill="none" stroke="%2333FF57" stroke-width="3"/><circle cx="76" cy="65" r="18" fill="none" stroke="%233357FF" stroke-width="3"/><circle cx="50" cy="80" r="18" fill="none" stroke="%23F333FF" stroke-width="3"/><circle cx="24" cy="65" r="18" fill="none" stroke="%23FFBD33" stroke-width="3"/><circle cx="24" cy="35" r="18" fill="none" stroke="%2333FFF3" stroke-width="3"/></svg>'>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        campagne: { light: '#FDFBF7', dark: '#131314' },
                        surface: { light: '#EFECE6', dark: '#1E1F20' },
                        userBg: { light: '#E3DFD5', dark: '#2B2C2F' }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
 
    <style>
        @keyframes logoBlink {
            0% { filter: brightness(1); opacity: 1; }
            50% { filter: brightness(0.4); opacity: 0.6; }
            100% { filter: brightness(1); opacity: 1; }
        }
        .logo-anim { animation: logoBlink 2.5s infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* CORRECTIF RESPONSIVE DU LOGO */
        .logo-llink {
            width: 100%;
            max-width: 8rem; /* Remplace les tailles en px par des rem */
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
        
        @media (max-width: 768px) {
            .logo-llink {
                max-width: 5rem; /* Réduit la taille max sur mobile */
            }
        }

        /* ACTIONS MESSAGES */
        .msg-actions { opacity: 0; transition: opacity 0.2s ease; }
        .msg-wrapper:hover .msg-actions { opacity: 1; }
        @media (max-width: 768px) {
            .msg-actions { opacity: 1; } /* Visible par défaut sur téléphone */
        }
    </style>
</head>
<body class="bg-campagne-light dark:bg-campagne-dark text-gray-900 dark:text-gray-100 h-full flex transition-colors duration-300 font-sans">

    <div id="sidebar" class="fixed lg:static inset-y-0 left-0 w-[20rem] bg-surface-light dark:bg-surface-dark z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col shadow-2xl lg:shadow-none">
        <div class="p-[1.5rem] flex justify-between items-center border-b border-gray-300 dark:border-gray-800">
            <div>
                <h2 class="text-[1.5rem] font-bold bg-gradient-to-r from-blue-500 to-red-500 bg-clip-text text-transparent">Llink</h2>
                <div class="text-[0.75rem] text-gray-500 dark:text-gray-400 font-bold tracking-wide">IA chat/traduction</div>
            </div>
            <button class="p-[0.5rem] rounded-full hover:bg-gray-300 dark:hover:bg-gray-700 lg:hidden" onclick="toggleSidebar()"><i data-lucide="x" class="w-[1.25rem] h-[1.25rem]"></i></button>
        </div>
        
        <div class="p-[1rem]">
            <button class="w-full flex items-center justify-center gap-[0.5rem] bg-gray-900 text-white dark:bg-white dark:text-gray-900 py-[0.75rem] rounded-full font-bold shadow-md hover:opacity-90 transition" onclick="newConversation()">
                <i data-lucide="plus" class="w-[1.25rem] h-[1.25rem]"></i> Nouvelle discussion
            </button>
        </div>
        
        <div class="flex-grow overflow-y-auto p-[1rem] space-y-[0.5rem] no-scrollbar" id="history">
            <div class="text-center p-[1rem] text-[0.875rem] font-bold text-gray-500 mt-[2.5rem]">Connectez-vous pour l'historique</div>
        </div>
     
        <div class="p-[1rem] border-t border-gray-300 dark:border-gray-800">
            <button class="w-full flex items-center gap-[0.75rem] py-[0.75rem] px-[1rem] rounded-xl hover:bg-gray-300 dark:hover:bg-gray-800 font-semibold transition" onclick="openSettings()">
                <i data-lucide="settings" class="w-[1.25rem] h-[1.25rem]"></i> Paramètres et aide
            </button>
        </div>
    </div>

    <div class="flex-grow flex flex-col h-full relative">
        <header class="p-[1rem] flex justify-between items-center z-10">
            <div class="flex items-center gap-[0.75rem]">
                <button class="p-[0.5rem] rounded-full hover:bg-surface-light dark:hover:bg-surface-dark lg:hidden transition" onclick="toggleSidebar()"><i data-lucide="menu" class="w-[1.5rem] h-[1.5rem]"></i></button>
                <button id="auth-btn" onclick="handleAuth()" class="w-[2.5rem] h-[2.5rem] rounded-full bg-blue-500 text-white flex items-center justify-center shadow-md hover:scale-105 transition">
                    <i data-lucide="log-in" class="w-[1.25rem] h-[1.25rem]"></i>
                </button>
                <button id="mode-btn" onclick="toggleMode()" class="w-[2.5rem] h-[2.5rem] rounded-full bg-surface-light dark:bg-surface-dark flex items-center justify-center hover:scale-105 transition">
                    <i data-lucide="message-square" class="w-[1.25rem] h-[1.25rem]"></i>
                </button>
            </div>
            <div class="flex items-center">
                <button onclick="toggleOnline()" class="w-[2.5rem] h-[2.5rem] rounded-full bg-surface-light dark:bg-surface-dark flex items-center justify-center hover:scale-105 transition">
                    <span id="network-status" class="w-[0.875rem] h-[0.875rem] rounded-full bg-green-500 shadow-[0_0_8px_#34A853]"></span>
                </button>
            </div>
        </header>

        <div id="lang-bar" class="hidden mx-auto bg-surface-light dark:bg-surface-dark rounded-full px-[1rem] py-[0.5rem] items-center gap-[0.75rem] shadow-sm mb-[1rem]">
            <select id="source-lang" class="bg-transparent font-bold text-[0.875rem] outline-none cursor-pointer"><option value="fr">Français</option><option value="en">Anglais</option><option value="sw">Swahili</option><option value="ln">Lingala</option></select>
            <i data-lucide="arrow-right-left" class="w-[1rem] h-[1rem] text-gray-500"></i>
            <select id="target-lang" class="bg-transparent font-bold text-[0.875rem] outline-none cursor-pointer"><option value="en">Anglais</option><option value="fr">Français</option><option value="sw">Swahili</option><option value="ln">Lingala</option></select>
        </div>

        <div id="chat-window" class="flex-grow overflow-y-auto p-[1rem] md:p-[2rem] space-y-[1.5rem] max-w-[56rem] mx-auto w-full no-scrollbar scroll-smooth"></div>

        <div class="p-[1rem] bg-transparent max-w-[56rem] mx-auto w-full">
            <div class="bg-surface-light dark:bg-surface-dark rounded-2xl p-[0.75rem] shadow-lg flex flex-col gap-[0.5rem] relative">
                
                <div id="pro-alert" class="hidden text-[0.75rem] font-bold text-center py-[0.25rem] px-[0.5rem] rounded bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 mb-[0.25rem]">
                    Accès Hors-Ligne expiré ou non abonné.
                </div>

                <textarea id="user-msg" placeholder="Commencez à discuter..." class="w-full bg-transparent border-none outline-none resize-none p-[0.5rem] text-[1rem] max-h-[10rem] overflow-y-auto no-scrollbar" oninput="this.style.height='3rem';this.style.height=this.scrollHeight+'px'"></textarea>
                
                <div class="flex justify-between items-center mt-[0.5rem]">
                    <div class="flex items-center gap-[0.5rem]">
                        <select id="model-selector" class="bg-userBg-light dark:bg-userBg-dark text-[0.75rem] font-bold rounded-lg px-[0.5rem] py-[0.375rem] outline-none cursor-pointer">
                            <option value="gemini-1.5-flash">✨ Standard (Gemini)</option>
                            <option value="deepseek-v3">🧠 Réflexion (DeepSeek)</option>
                        </select>
                        <button onclick="toggleMediaMenu()" class="p-[0.5rem] rounded-full hover:bg-gray-300 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-400 transition"><i data-lucide="paperclip" class="w-[1.25rem] h-[1.25rem]"></i></button>
                        <button id="mic-btn" onclick="handleVoice()" class="p-[0.5rem] rounded-full hover:bg-gray-300 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-400 transition"><i data-lucide="mic" class="w-[1.25rem] h-[1.25rem]"></i></button>
                    </div>
                    <button onclick="sendFromInput()" class="w-[2.5rem] h-[2.5rem] rounded-full bg-gray-900 text-white dark:bg-white dark:text-gray-900 flex items-center justify-center hover:scale-105 transition"><i data-lucide="send" class="w-[1.25rem] h-[1.25rem]"></i></button>
                </div>

                <div id="media-menu" class="hidden absolute bottom-[4rem] left-[1rem] bg-campagne-light dark:bg-campagne-dark rounded-xl shadow-xl flex-col border border-gray-200 dark:border-gray-800 overflow-hidden z-50">
                    <button onclick="triggerInput('camera-in')" class="flex items-center gap-[0.75rem] px-[1rem] py-[0.75rem] hover:bg-surface-light dark:hover:bg-surface-dark font-semibold text-[0.875rem] transition"><i data-lucide="camera" class="w-[1rem] h-[1rem]"></i> Prendre photo</button>
                    <button onclick="triggerInput('file-in')" class="flex items-center gap-[0.75rem] px-[1rem] py-[0.75rem] hover:bg-surface-light dark:hover:bg-surface-dark font-semibold text-[0.875rem] transition"><i data-lucide="image" class="w-[1rem] h-[1rem]"></i> Choisir image</button>
                </div>
            </div>
            <div class="text-center text-[0.65rem] font-bold text-gray-400 mt-[0.75rem] tracking-widest uppercase">from Flow Lab</div>
        </div>
    </div>

    <input type="file" id="file-in" class="hidden" accept="image/*">
    <input type="file" id="camera-in" class="hidden" accept="image/*" capture="environment">

    <div id="rename-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-[1rem] z-[3000]">
        <div class="bg-campagne-light dark:bg-campagne-dark w-full max-w-[24rem] rounded-3xl p-[1.5rem] shadow-2xl">
            <h3 class="text-[1.125rem] font-bold mb-[0.75rem]">Renommer la discussion</h3>
            <input type="text" id="rename-input" class="w-full px-[1rem] py-[0.75rem] rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent mb-[1rem] outline-none font-medium" placeholder="Nouveau nom...">
            <div class="flex justify-end gap-[0.5rem]">
                <button onclick="closeModal('rename-modal')" class="px-[1rem] py-[0.5rem] rounded-xl bg-gray-300 dark:bg-gray-700 font-bold hover:brightness-95 transition">Annuler</button>
                <button onclick="saveChatName()" class="px-[1rem] py-[0.5rem] rounded-xl bg-gray-900 text-white dark:bg-white dark:text-gray-900 font-bold hover:scale-105 transition">Enregistrer</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-[1rem] z-[3000]">
        <div class="bg-campagne-light dark:bg-campagne-dark w-full max-w-[28rem] rounded-3xl p-[1.5rem] shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center mb-[1.5rem]">
                <h3 class="text-[1.25rem] font-extrabold">Paramètres</h3>
                <button onclick="closeSettings()" class="p-[0.5rem] bg-surface-light dark:bg-surface-dark rounded-full hover:scale-105 transition"><i data-lucide="x" class="w-[1.25rem] h-[1.25rem]"></i></button>
            </div>

            <div class="space-y-[0.75rem]">
                <button onclick="toggleTheme()" class="w-full flex items-center gap-[1rem] p-[1rem] bg-surface-light dark:bg-surface-dark rounded-2xl font-bold hover:brightness-95 transition">
                    <i data-lucide="moon" class="w-[1.25rem] h-[1.25rem] text-indigo-500"></i> Changer de thème
                </button>
                
                <button onclick="toggleSettingPanel('panel-sub')" class="w-full flex items-center gap-[1rem] p-[1rem] bg-surface-light dark:bg-surface-dark rounded-2xl font-bold hover:brightness-95 transition">
                    <i data-lucide="credit-card" class="w-[1.25rem] h-[1.25rem] text-emerald-500"></i> Abonnement & Mode Offline
                </button>
                <div id="panel-sub" class="hidden p-[1rem] bg-userBg-light dark:bg-userBg-dark rounded-xl mt-[0.5rem] border border-gray-300 dark:border-gray-700">
                    <div id="subscription-info" class="text-[0.875rem] font-bold text-center mb-[1rem] text-blue-600 dark:text-blue-400">Vérification...</div>
                    <div class="text-center mb-[1rem]">
                        <p class="text-[0.875rem] mb-[0.25rem]">Envoyez <strong>2.5$</strong> ou <strong>5000 FC</strong> via Airtel Money au :</p>
                        <p class="text-[1.25rem] font-black text-red-600 tracking-widest">0979169846</p>
                    </div>
                    <input type="text" id="transaction-id" placeholder="Entrez l'ID de transaction ici..." class="w-full p-[0.75rem] rounded-xl bg-campagne-light dark:bg-campagne-dark border border-gray-300 dark:border-gray-600 mb-[0.75rem] outline-none font-bold text-[0.875rem]">
                    <button onclick="submitSubscription()" class="w-full p-[0.75rem] bg-gray-900 text-white dark:bg-white dark:text-gray-900 font-bold rounded-xl shadow-md hover:scale-105 transition">Valider</button>
                </div>

                <button onclick="toggleSettingPanel('panel-pref')" class="w-full flex items-center gap-[1rem] p-[1rem] bg-surface-light dark:bg-surface-dark rounded-2xl font-bold hover:brightness-95 transition">
                    <i data-lucide="sliders" class="w-[1.25rem] h-[1.25rem] text-orange-500"></i> Préférences personnelles
                </button>
                <div id="panel-pref" class="hidden p-[1rem] bg-userBg-light dark:bg-userBg-dark rounded-xl mt-[0.5rem] border border-gray-300 dark:border-gray-700">
                    <p class="text-[0.75rem] font-bold text-gray-500 mb-[0.75rem]">Enregistrez ici vos informations et vos préférences.</p>
                    <textarea id="pref-input" placeholder="Par exemple j'aime les messages courts..." class="w-full h-[6rem] p-[0.75rem] rounded-xl bg-campagne-light dark:bg-campagne-dark border border-gray-300 dark:border-gray-600 mb-[0.75rem] outline-none text-[0.875rem] resize-none"></textarea>
                    <button onclick="savePreferences()" class="w-full p-[0.75rem] bg-gray-900 text-white dark:bg-white dark:text-gray-900 font-bold rounded-xl shadow-md hover:scale-105 transition">Enregistrer</button>
                </div>

                <button onclick="window.open('https://klgaby440-lang.github.io/ll-aide/', '_blank')" class="w-full flex items-center gap-[1rem] p-[1rem] bg-surface-light dark:bg-surface-dark rounded-2xl font-bold hover:brightness-95 transition">
                    <i data-lucide="help-circle" class="w-[1.25rem] h-[1.25rem] text-purple-500"></i> Aide
                </button>
            </div>
            <div class="text-center text-[0.65rem] font-bold text-gray-400 mt-[1.5rem] tracking-widest uppercase">from Flow Lab</div>
        </div>
    </div>

    <script type="module">
        import { env, pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers';
        
        // CONFIGURATION OFFLINE STRICTE
        env.allowLocalModels = true; 
        env.allowRemoteModels = false; // Ne cherche plus sur HuggingFace
        env.localModelPath = '/models/'; // Le dossier de tes modèles à la racine de ton site web

        window.generateOfflineText = async (prompt, loadingId) => {
            try {
                if(!window.localAI) {
                    document.getElementById(loadingId).querySelector('.msg-content').innerHTML = `<span class="text-[0.75rem] font-bold animate-pulse">📥 Initialisation du moteur neuronal local (depuis /models/)...</span>`;
                    window.localAI = await pipeline('text-generation', 'SmolLM-135M-Instruct', { device: 'wasm', dtype: 'q4' });
                }                
                document.getElementById(loadingId).querySelector('.msg-content').innerHTML = `<span class="text-[0.75rem] font-bold animate-pulse">🧠 Analyse hors-ligne en cours...</span>`;
                const messages = [{ role: "user", content: prompt }];
                const out = await window.localAI(messages, { max_new_tokens: 150});
                let response = out[0].generated_text;
                if(Array.isArray(response)) response = response[response.length - 1].content;
                return response;
            } catch (error) { return "❌ Erreur critique mémoire. Vérifiez que le dossier /models/ est bien déployé sur Vercel avec votre code."; }
        };
    </script>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        const firebaseConfig = { 
            apiKey: "AIzaSyDJPf1206nZjpw58OOnCpX4Gq9YFFQ0nUU", 
            authDomain: "llink-ee40e.firebaseapp.com", 
            projectId: "llink-ee40e" 
        };
        const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        window.auth = auth;

        window.handleAuth = async () => { 
            if (window.isLoggedIn) { 
                try { await signOut(auth); } catch (e) { console.error("Erreur déconnexion:", e); }
            } else { 
                try { await signInWithPopup(auth, provider); } catch (e) { console.error("Erreur Auth:", e); } 
            }
        };

        onAuthStateChanged(auth, async (user) => {
            const authBtn = document.getElementById('auth-btn');
            if (user) {
                window.isLoggedIn = true; 
                window.authToken = await user.getIdToken(); 
                window.uid = user.uid;
                if (authBtn) authBtn.innerHTML = `<img src="${user.photoURL}" alt="User" class="w-full h-full object-cover rounded-full">`;
                
                try {
                    if (typeof window.checkSubscription === "function") await window.checkSubscription();
                    if (typeof window.restoreHistory === "function") await window.restoreHistory();
                    if (typeof window.loadHistory === "function") window.loadHistory();
                } catch (err) { console.error("Erreur post-connexion :", err); }
            } else {
                window.isLoggedIn = false;
                window.authToken = null; 
                window.uid = "anonymous";
                window.isOfflineValid = false;
                if (authBtn) authBtn.innerHTML = `<i data-lucide="log-in" class="w-[1.25rem] h-[1.25rem]"></i>`;
                const historyContainer = document.getElementById('history');
                if (historyContainer) historyContainer.innerHTML = `<div class="text-center p-[1rem] text-[0.875rem] font-bold text-gray-500 mt-[2.5rem]">Connectez-vous pour l'historique</div>`;
                if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") lucide.createIcons();
            }
        });
    </script>

    <script src="script.js">
    </script>
</body>
</html>
