<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Llink | FLOW LAB</title>
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="20" r="18" fill="none" stroke="%23FF5733" stroke-width="3"/><circle cx="76" cy="35" r="18" fill="none" stroke="%2333FF57" stroke-width="3"/><circle cx="76" cy="65" r="18" fill="none" stroke="%233357FF" stroke-width="3"/><circle cx="50" cy="80" r="18" fill="none" stroke="%23F333FF" stroke-width="3"/><circle cx="24" cy="65" r="18" fill="none" stroke="%23FFBD33" stroke-width="3"/><circle cx="24" cy="35" r="18" fill="none" stroke="%2333FFF3" stroke-width="3"/></svg>'>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        campagne: { light: '#FDFBF7', dark: '#131314' },
                        surface: { light: '#EFECE6', dark: '#1E1F20' },
                        userBg: { light: '#E3DFD5', dark: '#2B2C2F' }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
 
    <style>
/* =========================================
   VARIABLES & CONFIGURATION GLOBALE
   ========================================= */
:root {
    --campagne-light: #FDFBF7;
    --surface-light: #EFECE6;
    --userBg-light: #E3DFD5;
    --text-light: #111827; 
    --border-light: #d1d5db; 
    
    --campagne-dark: #131314;
    --surface-dark: #1E1F20;
    --userBg-dark: #2B2C2F;
    --text-dark: #f3f4f6; 
    --border-dark: #1f2937; 
}

html.h-full, body.app-body {
    height: 100%;
}

body.app-body {
    background-color: var(--campagne-light);
    color: var(--text-light);
    display: flex;
    transition: background-color 0.3s, color 0.3s;
    font-family: sans-serif;
    margin: 0;
}

.dark body.app-body {
    background-color: var(--campagne-dark);
    color: var(--text-dark);
}

.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.hidden { display: none !important; }
.flex-grow { flex-grow: 1; }

/* =========================================
   SIDEBAR
   ========================================= */
.sidebar {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: 20rem;
    background-color: var(--surface-light);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); 
}

.sidebar.open { transform: translateX(0); } 

.dark .sidebar {
    background-color: var(--surface-dark);
}

@media (min-width: 1024px) { 
    .sidebar {
        position: static;
        transform: translateX(0);
        box-shadow: none;
    }
}

.sidebar-header {
    padding: 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-light);
}

.dark .sidebar-header { border-bottom-color: var(--border-dark); }

.app-title {
    font-size: 1.5rem;
    font-weight: bold;
    background-image: linear-gradient(to right, #3b82f6, #ef4444);
    -webkit-background-clip: text;
    color: transparent;
    margin: 0;
}

.app-subtitle {
    font-size: 0.75rem;
    color: #6b7280;
    font-weight: bold;
    letter-spacing: 0.025em;
}

.dark .app-subtitle { color: #9ca3af; }

.btn-new-chat {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    background-color: #111827;
    color: white;
    padding: 0.75rem 0;
    border-radius: 9999px;
    font-weight: bold;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
}

.dark .btn-new-chat {
    background-color: white;
    color: #111827;
}

.btn-new-chat:hover { opacity: 0.9; }

.history-container {
    padding: 1rem;
    overflow-y: auto;
}

.history-empty {
    text-align: center;
    padding: 1rem;
    font-size: 0.875rem;
    font-weight: bold;
    color: #6b7280;
    margin-top: 2.5rem;
}

.sidebar-footer {
    padding: 1rem;
    border-top: 1px solid var(--border-light);
}

.dark .sidebar-footer { border-top-color: var(--border-dark); }

.btn-settings {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    font-weight: 600;
    background: transparent;
    border: none;
    color: inherit;
    cursor: pointer;
    transition: background-color 0.2s;
}

.btn-settings:hover { background-color: var(--border-light); }
.dark .btn-settings:hover { background-color: var(--border-dark); }

/* =========================================
   MAIN CONTENT & HEADER
   ========================================= */
.main-layout {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
}

.top-header {
    padding: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}

.header-actions { display: flex; align-items: center; gap: 0.75rem; }

.btn-icon-round {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    transition: transform 0.2s, background-color 0.2s;
    background-color: var(--surface-light);
    color: inherit;
}

.dark .btn-icon-round { background-color: var(--surface-dark); }
.btn-icon-round:hover { transform: scale(1.05); }

.btn-icon-round.primary {
    background-color: #3b82f6;
    color: white;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.status-dot {
    width: 0.875rem;
    height: 0.875rem;
    border-radius: 9999px;
    box-shadow: 0 0 8px #34A853;
}

/* =========================================
   LANG BAR & CHAT WINDOW
   ========================================= */
.lang-bar {
    display: flex;
    margin: 0 auto 1rem auto;
    background-color: var(--surface-light);
    border-radius: 9999px;
    padding: 0.5rem 1rem;
    align-items: center;
    gap: 0.75rem;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}

.dark .lang-bar { background-color: var(--surface-dark); }

.lang-select {
    background: transparent;
    font-weight: bold;
    font-size: 0.875rem;
    outline: none;
    cursor: pointer;
    border: none;
    color: inherit;
}

.chat-window {
    flex-grow: 1;
    overflow-y: auto;
    padding: 1rem;
    max-width: 56rem;
    margin: 0 auto;
    width: 100%;
    scroll-behavior: smooth;
    box-sizing: border-box;
}

@media (min-width: 768px) { .chat-window { padding: 2rem; } }

/* =========================================
   INPUT AREA
   ========================================= */
.input-container {
    padding: 1rem;
    background: transparent;
    max-width: 56rem;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
}

.input-box {
    background-color: var(--surface-light);
    border-radius: 1rem; 
    padding: 0.75rem;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    position: relative;
}

.dark .input-box { background-color: var(--surface-dark); }

.alert-pro {
    font-size: 0.75rem;
    font-weight: bold;
    text-align: center;
    padding: 0.25rem 0.5rem;
    border-radius: 0.25rem;
    background-color: #fee2e2; 
    color: #dc2626; 
    margin-bottom: 0.25rem;
}

.dark .alert-pro { background-color: rgba(127, 29, 29, 0.3); color: #f87171; }

.main-textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    padding: 0.5rem;
    font-size: 1rem;
    max-height: 10rem;
    overflow-y: auto;
    color: inherit;
    font-family: inherit;
    box-sizing: border-box;
}

.input-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.5rem;
}

.input-actions { display: flex; align-items: center; gap: 0.5rem; }

.select-model {
    background-color: var(--userBg-light);
    font-size: 0.75rem;
    font-weight: bold;
    border-radius: 0.5rem;
    padding: 0.375rem 0.5rem;
    outline: none;
    cursor: pointer;
    border: none;
    color: inherit;
}

.dark .select-model { background-color: var(--userBg-dark); }

.btn-transparent-icon {
    padding: 0.5rem;
    border-radius: 9999px;
    border: none;
    background: transparent;
    color: #4b5563; 
    cursor: pointer;
    transition: background-color 0.2s;
}

.dark .btn-transparent-icon { color: #9ca3af; }
.btn-transparent-icon:hover { background-color: var(--border-light); }
.dark .btn-transparent-icon:hover { background-color: var(--border-dark); }

.btn-send {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 9999px;
    background-color: #111827;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    transition: transform 0.2s;
}

.dark .btn-send { background-color: white; color: #111827; }
.btn-send:hover { transform: scale(1.05); }

.brand-text {
    text-align: center;
    font-size: 0.65rem;
    font-weight: bold;
    color: #9ca3af;
    margin-top: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}
    </style>
</head>

<body class="app-body">

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div>
                <h2 class="app-title">Llink</h2>
                <div class="app-subtitle">IA chat/traduction</div>
            </div>
            <button class="btn-icon-round lg:hidden" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
        </div>
        
        <div style="padding: 1rem;">
            <button class="btn-new-chat" onclick="window.newConversation()">
                <i data-lucide="plus"></i> Nouvelle discussion
            </button>
        </div>
        
        <div class="history-container no-scrollbar" id="history">
            <div class="history-empty">Connectez-vous pour l'historique</div>
        </div>
     
        <div class="sidebar-footer">
            <button class="btn-settings" onclick="openSettings()">
                <i data-lucide="settings"></i> Paramètres et aide
            </button>
        </div>
    </div>

    <div class="main-layout">
        <header class="top-header">
            <div class="header-actions">
                <button class="btn-icon-round lg:hidden" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
                <button id="auth-btn" onclick="handleAuth()" class="btn-icon-round primary">
                    <i data-lucide="log-in"></i>
                </button>
                <button id="mode-btn" onclick="toggleMode()" class="btn-icon-round">
                    <i data-lucide="message-square"></i>
                </button>
            </div>
            <div class="header-actions">
                <button onclick="toggleOnline()" class="btn-icon-round">
                    <span id="network-status" class="status-dot bg-green-500"></span>
                </button>
            </div>
        </header>

        <div id="lang-bar" class="lang-bar hidden">
            <select id="source-lang" class="lang-select">
                <option value="fr">Français</option>
                <option value="en">Anglais</option>
                <option value="sw">Swahili</option>
                <option value="ln">Lingala</option>
            </select>
            <i data-lucide="arrow-right-left" style="width:1rem; color:gray;"></i>
            <select id="target-lang" class="lang-select">
                <option value="en">Anglais</option>
                <option value="fr">Français</option>
                <option value="sw">Swahili</option>
                <option value="ln">Lingala</option>
            </select>
        </div>

        <div id="chat-window" class="chat-window no-scrollbar"></div>

        <div class="input-container">
            <div class="input-box">
                <div id="pro-alert" class="alert-pro hidden">
                    Accès Hors-Ligne expiré ou non abonné.
                </div>

                <textarea id="user-msg" placeholder="Commencez à discuter..." class="main-textarea no-scrollbar" oninput="this.style.height='3rem';this.style.height=this.scrollHeight+'px'"></textarea>
                
                <div class="input-footer">
                    <div class="input-actions">
                        <select id="model-selector" class="select-model">
                            <option value="gemini-1.5-flash">✨ Standard (Gemini)</option>
                            <option value="deepseek-v3">🧠 Réflexion (DeepSeek)</option>
                        </select>
                        <button onclick="toggleMediaMenu()" class="btn-transparent-icon"><i data-lucide="paperclip"></i></button>
                        <button id="mic-btn" onclick="handleVoice()" class="btn-transparent-icon"><i data-lucide="mic"></i></button>
                    </div>
                    <button onclick="sendFromInput()" class="btn-send"><i data-lucide="send"></i></button>
                </div>
            </div>
            <div class="brand-text">from Flow Lab</div>
        </div>
    </div>

    <div style="display: none;">
        <input type="file" id="file-in" accept="image/*">
        <input type="file" id="camera-in" accept="image/*" capture="environment">
        
        <div id="media-menu" style="display: none;"></div>
        
        <div id="settings-modal" style="display: none;">
            <div class="bg-white p-4 rounded">
                <textarea id="pref-input"></textarea>
                <button onclick="savePreferences()">Sauvegarder</button>
                <div id="subscription-info"></div>
                <input type="text" id="transaction-id">
                <button onclick="submitSubscription()">Valider</button>
                <button onclick="closeSettings()">Fermer</button>
            </div>
        </div>

        <div id="rename-modal" style="display: none;">
            <input type="text" id="rename-input">
            <button onclick="window.saveChatName()">OK</button>
            <button onclick="window.closeModal('rename-modal')">Annuler</button>
        </div>
    </div>

    <script type="module">
        import { env, pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers';
        
        // CONFIGURATION OFFLINE COMPATIBLE SMARTPHONE (CAPACITOR)
        env.allowLocalModels = true; 
        env.allowRemoteModels = false; 
        env.localModelPath = './models/'; // Chemin relatif obligatoire pour le local natif Android

        window.generateOfflineText = async (prompt, loadingId) => {
            try {
                if(!window.localAI) {
                    const contentBox = document.getElementById(loadingId).querySelector('.msg-content');
                    if(contentBox) contentBox.innerHTML = `<span class="text-xs font-bold animate-pulse">📥 Initialisation de l'IA locale (depuis /models/)...</span>`;
                    
                    // Alignement exact avec le dossier généré par ton script GitHub Actions
                    window.localAI = await pipeline('text-generation', 'SmolLM2-135M-Instruct', { device: 'wasm', dtype: 'q4' });
                }                
                
                const contentBox = document.getElementById(loadingId).querySelector('.msg-content');
                if(contentBox) contentBox.innerHTML = `<span class="text-xs font-bold animate-pulse">🧠 Analyse hors-ligne en cours...</span>`;
                
                const messages = [{ role: "user", content: prompt }];
                const out = await window.localAI(messages, { max_new_tokens: 150 });
                
                let response = out[0].generated_text;
                if(Array.isArray(response)) response = response[response.length - 1].content;
                return response;
            } catch (error) { 
                console.error(error);
                return "❌ Erreur critique mémoire. Vérifiez que le dossier /models/SmolLM2-135M-Instruct est correctement déployé dans vos assets."; 
            }
        };
    </script>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = { 
            apiKey: "AIzaSyDJPf1206nZjpw58OOnCpX4Gq9YFFQ0nUU", 
            authDomain: "llink-ee40e.firebaseapp.com", 
            projectId: "llink-ee40e" 
        };
        const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        window.auth = auth;

        window.handleAuth = async () => { 
            if (window.isLoggedIn) { 
                try { await signOut(auth); } catch (e) { console.error("Erreur déconnexion:", e); }
            } else { 
                try { await signInWithPopup(auth, provider); } catch (e) { console.error("Erreur Auth:", e); } 
            }
        };

        onAuthStateChanged(auth, async (user) => {
            const authBtn = document.getElementById('auth-btn');
            if (user) {
                window.isLoggedIn = true; 
                window.authToken = await user.getIdToken(); 
                window.uid = user.uid;
                if (authBtn) authBtn.innerHTML = `<img src="${user.photoURL}" alt="User" class="w-full h-full object-cover rounded-full">`;
                
                try {
                    if (typeof window.checkSubscription === "function") await window.checkSubscription();
                    if (typeof window.restoreHistory === "function") await window.restoreHistory();
                    if (typeof window.loadHistory === "function") window.loadHistory();
                } catch (err) { console.error("Erreur post-connexion :", err); }
            } else {
                window.isLoggedIn = false;
                window.authToken = null; 
                window.uid = "anonymous";
                window.isOfflineValid = false;
                if (authBtn) authBtn.innerHTML = `<i data-lucide="log-in" class="w-5 h-5"></i>`;
                const historyContainer = document.getElementById('history');
                if (historyContainer) historyContainer.innerHTML = `<div class="text-center p-4 text-sm font-bold text-gray-500 mt-10">Connectez-vous pour l'historique</div>`;
                if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") lucide.createIcons();
            }
        });
    </script>

    <script src="script.js" defer></script>
</body>
</html>
