name: Build Android APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21' # 🔥 Mis à jour de 17 à 21 pour résoudre l'erreur "invalid source release"

    - name: Install Dependencies
      run: npm install

    # 🛠️ ETAPE 1 : Téléchargement des scripts CDN pour un mode 100% hors-ligne
    - name: Download External Dependencies
      run: |
        # On crée un dossier pour stocker les scripts localement dans ton dossier web
        mkdir -p www/offline-assets
        
        # Téléchargement de toutes les librairies externes
        wget -qO www/offline-assets/tailwindcss.js https://cdn.tailwindcss.com
        wget -qO www/offline-assets/lucide.js https://unpkg.com/lucide@latest
        wget -qO www/offline-assets/dexie.js https://unpkg.com/dexie/dist/dexie.js
        wget -qO www/offline-assets/tesseract.min.js https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js
        
        # Remplacement automatique des liens dans tes fichiers HTML par les chemins locaux
        find . -name "*.html" -exec sed -i 's|https://cdn.tailwindcss.com|./offline-assets/tailwindcss.js|g' {} +
        find . -name "*.html" -exec sed -i 's|https://unpkg.com/lucide@latest|./offline-assets/lucide.js|g' {} +
        find . -name "*.html" -exec sed -i 's|https://unpkg.com/dexie/dist/dexie.js|./offline-assets/dexie.js|g' {} +
        find . -name "*.html" -exec sed -i 's|https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js|./offline-assets/tesseract.min.js|g' {} +

    # 🧠 ETAPE 2 : Téléchargement sécurisé via le module Python (Correction stricte de la casse)
    - name: Download Offline AI Model
      run: |
        pip install huggingface_hub
        python3 -c "
        import os
        from huggingface_hub import snapshot_download
        
        # Le dossier local sur ton disque reste propre avec sa structure
        local_dir = 'www/models/SmolLM2-360M-Instruct'
        os.makedirs(local_dir, exist_ok=True)
        
        print('=== Début du téléchargement du modèle SmolLM2 ===')
        
        # Correction de la casse ici : 'SmolLM2-360M-Instruct' avec la bonne casse publique
        snapshot_download(
            repo_id='onnx-community/SmolLM2-360M-Instruct',
            local_dir=local_dir,
            allow_patterns=['*.onnx', 'onnx/*', '*.json', '*.txt']
        )
        
        print('=== Téléchargement local terminé avec succès ! ===')
        "

    - name: Add Android Platform
      run: npx cap add android

    - name: Capacitor Sync
      run: npx cap sync
        
    # 📦 ETAPE 3 : Génération simultanée du APK et du AAB
    - name: Build APK and AAB with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug # Génère le app-debug.apk (Pour tes tests)
        ./gradlew bundleDebug   # Génère le app-debug.aab (Pour le Play Store)

    - name: Upload App Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lugalink-android-builds
        path: |
          ./android/app/build/outputs/apk/debug/app-debug.apk
          ./android/app/build/outputs/bundle/debug/app-debug.aab
