name: Build Android APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21' # Maintien de la version 21 pour ton build Android moderne

    - name: Install Dependencies
      run: npm install

    # 🛠️ ETAPE 1 : Téléchargement des scripts CDN pour ton mode hors-ligne
    - name: Download External Dependencies
      run: |
        mkdir -p www/offline-assets
        
        wget -qO www/offline-assets/tailwindcss.js https://cdn.tailwindcss.com
        wget -qO www/offline-assets/lucide.js https://unpkg.com/lucide@latest
        wget -qO www/offline-assets/dexie.js https://unpkg.com/dexie/dist/dexie.js
        wget -qO www/offline-assets/tesseract.min.js https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js
        
        find . -name "*.html" -exec sed -i 's|https://cdn.tailwindcss.com|./offline-assets/tailwindcss.js|g' {} +
        find . -name "*.html" -exec sed -i 's|https://unpkg.com/lucide@latest|./offline-assets/lucide.js|g' {} +
        find . -name "*.html" -exec sed -i 's|https://unpkg.com/dexie/dist/dexie.js|./offline-assets/dexie.js|g' {} +
        find . -name "*.html" -exec sed -i 's|https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js|./offline-assets/tesseract.min.js|g' {} +

    # 🧠 ETAPE 2 : Téléchargement sécurisé via ta variable d'environnement HF_TOKEN
    - name: Download Offline AI Model
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }} # 👈 GitHub injecte ici ton secret caché dans la variable d'environnement
      run: |
        pip install huggingface_hub
        python3 -c "
        import os
        from huggingface_hub import snapshot_download
        
        repo_id = 'onnx-community/SmolLM2-360M-Instruct-ONNX'
        local_dir = 'www/models/SmolLM2-360M-Instruct'
        
        print('=== Début du téléchargement authentifié du modèle SmolLM2 ===')
        
        # os.environ.get('HF_TOKEN') extrait de manière sécurisée la variable d'environnement définie juste au-dessus
        snapshot_download(
            repo_id=repo_id,
            local_dir=local_dir,
            allow_patterns=['*.onnx', 'onnx/*', '*.json', '*.txt'],
            token=os.environ.get('HF_TOKEN')
        )
        
        print('=== Téléchargement local terminé avec succès ! ===')
        "

    - name: Add Android Platform
      run: npx cap add android

    - name: Capacitor Sync
      run: npx cap sync
        
    # 📦 ETAPE 3 : Compilation Gradle vers APK et AAB
    - name: Build APK and AAB with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug # Génère ton fichier de test app-debug.apk
        ./gradlew bundleDebug   # Génère ton fichier app-debug.aab pour le Play Store

    - name: Upload App Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lugalink-android-builds
        path: |
          ./android/app/build/outputs/apk/debug/app-debug.apk
          ./android/app/build/outputs/bundle/debug/app-debug.aab
