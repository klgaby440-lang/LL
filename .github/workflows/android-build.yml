name: Build Android APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    
    # 🌟 ICI : On indique à GitHub le dossier contenant le package.json
    defaults:
      run:
        working-directory: ./Llink  # <-- REMPLACE par le nom exact de ton sous-dossier

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Capacitor Sync
      run: |
        npx cap sync
        
    - name: Build APK with Gradle
      # Pour cette étape native, on force le sous-dossier android
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lugalink-debug-apk
        # Assure-toi que le chemin pointe bien vers le sous-dossier
        path: ./Llink/android/app/build/outputs/apk/debug/app-debug.apk
#Tout est enfin pret
